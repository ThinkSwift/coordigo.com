<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library · Coordigo</title>
<meta name="description" content="A picture stays a secret until someone connects the dots. Solve today's 16 × 16 mystery picture here, no app needed — then draw your own and send it to a friend as a code.">
<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161c" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://coordigo.com/library/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Coordigo">
<meta property="og:url" content="https://coordigo.com/library/">
<meta property="og:title" content="Coordigo — Mystery pictures">
<meta property="og:description" content="A picture stays a secret until someone connects the dots. Try one here.">
<meta property="og:image" content="https://coordigo.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-itunes-app-after-6.2" content="app-id=1486330879">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=20261103">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20261103">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=20261103">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261103">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f4ec; --mat:#fffdf8; --ink:#1b1917; --muted:#6d6557;
    --line:rgba(27,25,23,.14); --hair:rgba(27,25,23,.09);
    --gold:#a8761a; --grid:rgba(27,25,23,.055); --mark:#d02670;
    --shadow:0 1px 2px rgba(27,25,23,.07), 0 10px 26px rgba(27,25,23,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15161c; --mat:#1d1f27; --ink:#eae5da; --muted:#9b9486;
      --line:rgba(234,229,218,.16); --hair:rgba(234,229,218,.10);
      --gold:#dcac48; --grid:rgba(234,229,218,.05); --mark:#ef5fa0;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:23px 23px; min-height:100vh;
  }
  main{max-width:1080px;margin:0 auto;padding:0 16px 48px}
  nav{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
  nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
  .mark{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--mark);font-weight:600;font-size:12px}
  nav .name{font-weight:600;font-size:17px}
  nav .store{margin-left:auto;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--ink);border-radius:999px;padding:7px 14px}
  .caps{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  h1{font-weight:600;font-size:clamp(30px,4.4vw,46px);line-height:1.12;margin:8px 0 12px;letter-spacing:-.01em}
  h2{font-weight:600;font-size:24px;margin:4px 0 6px}
  .lede{font-size:19px;color:var(--muted);max-width:30em;margin:0}
  .hero{display:grid;grid-template-columns:1fr minmax(320px,520px);gap:36px;align-items:start;padding:22px 0 10px}
  @media (max-width:820px){ .hero{grid-template-columns:1fr;gap:18px} }
  .play{background:var(--mat);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);padding:10px 4px 2px}
  .play .caps{padding:4px 14px 0}
  .play iframe{display:block;width:100%;height:640px;border:0;background:transparent}
  /* The intro film shows first; today's picture (or a tile) takes its place. */
  .film{position:relative;margin:0 6px}
  .film video{display:block;width:100%;aspect-ratio:1;border-radius:10px;background:#fff}
  .film .sound{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border:0;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:rgba(27,25,23,.55);color:#fff}
  .film .sound svg{width:18px;height:18px}
  .try{display:block;margin:12px auto 12px;font:600 15px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;
    border:1px solid var(--ink);border-radius:999px;padding:10px 20px;background:none;color:var(--ink)}
  /* A phone: the board takes the screen's width (as Photos does with a picture) — no card margin around it. */
  @media (max-width:600px){ .play{margin:0 -16px;border-radius:0;border-left:0;border-right:0;padding:8px 0 0}
    .film{margin:0} .film video{border-radius:0}
    h1{font-size:26px;margin:6px 0 8px} .lede{font-size:16px} .hero{padding-top:12px;gap:14px} }
  section{padding:30px 0 6px}
  .sub{color:var(--muted);margin:0 0 14px;max-width:36em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
  .tile{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  .tile .face{position:relative;aspect-ratio:1;background:#fffdf8;border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .tile .face svg{position:absolute;inset:8%;width:84%;height:84%}
  .tile .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;color:#1b1917b0}
  .tile .t{font-weight:600;font-size:15px;margin:8px 2px 0}
  .tile .d{font-size:13px;color:var(--muted);margin:0 2px}
  .tile.on .face{outline:2px solid var(--gold);outline-offset:2px}
  .tile .done{position:absolute;right:8px;top:8px;font:600 11px -apple-system,sans-serif;color:var(--gold);background:var(--mat);border-radius:999px;padding:3px 8px}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:700px){ .how{grid-template-columns:1fr} }
  .how div{background:var(--mat);border:1px solid var(--hair);border-radius:14px;padding:14px 16px}
  .how b{display:block;font:12px ui-monospace,Menlo,monospace;color:var(--gold);margin-bottom:4px}
  .get{text-align:center;padding:40px 0 10px}
  .btn{display:inline-block;text-decoration:none;font:600 16px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    border-radius:14px;padding:15px 26px;margin-top:12px;background:var(--ink);color:var(--paper)}
  footer{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:14px;color:var(--muted);padding:28px 0 0}
  footer a{color:inherit}
  [hidden]{display:none!important}

  /* coordigo.com pages: top tabs, App Store link, two site buttons (founder 2026-11-03) */
  nav.tabs-bar{display:flex;align-items:flex-end;padding:18px 0 0;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:6px}
  .tab{min-width:118px;padding:10px 16px 9px;margin-bottom:-1px;text-align:center;text-decoration:none;color:var(--muted);
    font:600 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;
    border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0}
  .tab:hover{color:var(--ink);border-color:var(--ink)}
  .tab[aria-current]{color:var(--ink);background:var(--mat);border-color:var(--ink);border-top-width:3px;padding-top:8px}
  .store-row{display:flex;justify-content:center;padding:40px 0 0}
  .store-row[hidden]{display:none}
  .appstore{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:8px 18px 8px 10px;border-radius:14px;
    background:#000;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .appstore img{border-radius:7px}
  .appstore span{display:flex;flex-direction:column;line-height:1.05}
  .appstore small{font-size:10.5px;opacity:.85}
  .appstore b{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .sites{display:flex;flex-wrap:wrap;gap:8px;margin:44px 0 0;padding:22px 0 0;border-top:1px solid var(--line)}
  .site{box-sizing:border-box;width:168px;min-height:42px;display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;
    color:#0b0f1a;text-decoration:none;font:500 13.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#eef1f7;border:2px solid #eef1f7;border-radius:10px}
  .site img{display:block;width:32px;height:32px;border-radius:6px;image-rendering:pixelated}
  .site:hover{border-color:#0b0f1a}
  @media (prefers-color-scheme: dark){ .site{border-color:#eef1f7} .site:hover{border-color:#6d6557} }
  @media (max-width:600px){ .tab{min-width:0;flex:1;padding:10px 6px 9px} .tabs{flex:1} .site{flex:1;width:auto} }

  .pager{display:flex;justify-content:center;gap:8px;margin:22px 0 0}
  .pager button{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--mat);color:var(--ink);cursor:pointer;
    font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .pager button[aria-current]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .play{margin:18px 0 0}
  .play[hidden]{display:none}
</style>
</head>
<body>
<main>
  <nav class="tabs-bar" aria-label="Coordigo"><div class="tabs"><a class="tab" href="/"><span>Coordigo</span></a><a class="tab" href="/library/" aria-current="page"><span data-t="libCaps">Library</span></a><a class="tab" href="/postcards/"><span>Postcards</span></a></div></nav>

  <section id="libTop">
    <div class="caps" data-t="libCaps">Library</div>
    <p class="sub" data-t="libSub">Mystery pictures to solve on your own. Connect the points; the answer comes at the end.</p>
    <div class="play" id="play" hidden>
      <div class="caps" id="playCaps"></div>
      <iframe id="player" title="Mystery picture"></iframe>
    </div>
    <div class="grid" id="solve" style="margin-top:16px"></div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </section>

  <section>
    <div class="caps" data-t="msgCaps">Messages to send</div>
    <p class="sub" data-t="msgSub">Solve one here. In the app, send it with your own words.</p>
    <div class="grid" id="messages"></div>
  </section>

  <div class="store-row" data-apple><a class="appstore" data-store="web-co-library"><img src="/art/icon-512.png" width="32" height="32" alt=""><span><small>Download on the</small><b>App Store</b></span></a></div>
  <section class="sites" aria-label="Also from Swiftian"><a class="site" href="https://iflipbook.com/?ct=web-co-if"><img src="/assets/links/iflipbook-32.png" srcset="/assets/links/iflipbook-32.png 1x, /assets/links/iflipbook-64.png 2x, /assets/links/iflipbook-96.png 3x" width="32" height="32" alt=""><span>iflipbook.com</span></a><a class="site" href="https://swiftian.com/?ct=web-co-sw"><img src="/assets/links/swiftian-32.png" srcset="/assets/links/swiftian-32.png 1x, /assets/links/swiftian-64.png 2x, /assets/links/swiftian-96.png 3x" width="32" height="32" alt=""><span>swiftian.com</span></a></section>
  <footer>
    <a href="/privacy/" data-t="privacy">Privacy Policy</a>
    <a href="/support/" data-t="support">Support</a>
  </footer>
</main>
<script src="/store.js"></script>
<script src="/mystery/strings.js"></script>
<script src="/mystery/engine.js"></script>
<script src="/library.js"></script>
<script src="/mystery/library-words.js"></script>
<script>
(() => {
  'use strict';

  const M = window.Mystery, $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
  const STORE = 'https://apps.apple.com/app/id1486330879';
  const table = window.MYSTERY_STRINGS;
  const lang = document.documentElement.dataset.lang || (() => {
    for (const raw of navigator.languages || [navigator.language || 'en']) {
      const l = raw.toLowerCase();
      if (l.startsWith('zh')) return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
      if (l.startsWith('pt')) return 'pt-BR';
      const p = l.split('-')[0];
      if (table[p]) return p;
    }
    return 'en';
  })();
  if (lang === 'ar') document.documentElement.dir = 'rtl';
  const t = (key, ...args) => {
    let s = (table[lang] && table[lang][key]) || table.en[key], i = 0;
    if (!s) return null;
    return s.replace(/%(?:(\d)\$)?(@|lld|d)/g, (_, n) => String(args[n ? +n - 1 : i++]));
  };
  for (const el of document.querySelectorAll('[data-t]')) { const s = t(el.dataset.t); if (s) el.textContent = s; }
  for (const el of document.querySelectorAll('[data-store]')) el.href = STORE + '?ct=' + el.dataset.store;
  // Coordigo runs on iPhone, iPad and Mac; and before Coordigo 6.2 is in the App Store (store.js) no link leads to the app.
  const appleDevice = /iPhone|iPad|Macintosh/.test(navigator.userAgent);
  if (!appleDevice || window.CO_STORE !== true) for (const el of document.querySelectorAll('[data-apple]')) el.hidden = true;
  const all = window.CO_LIBRARY || [];
  const toSolve = all.filter(i => i.theme !== 'messages');
  const localized = item => (item.theme === 'messages' && ((window.MYSTERY_LIBRARY_WORDS || {})[lang] || {})[item.id]) || item.payload;
  const player = $('player');
  addEventListener('message', e => {
    if (e.source !== player.contentWindow || !e.data || !e.data.co) return;
    if (e.data.co === 'height') player.style.height = Math.max(420, e.data.h + 8) + 'px';
    if (e.data.co === 'solved' && window.onSolved) window.onSolved();
  });
  const load = item => { player.src = '/mystery/?embed&lang=' + encodeURIComponent(lang) + '#' + localized(item); };


  // MARK: Tiles — an envelope for pictures to solve (the answer stays hidden), the picture itself for messages.
  const solvedKey = payload => { let h = 0x811c9dc5; for (let i = 0; i < payload.length; i++) { h ^= payload.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return 'coordigo.mystery.' + h.toString(16) + '.solved'; };
  const solved = payload => { try { return JSON.parse(localStorage.getItem(solvedKey(payload))) === true; } catch (e) { return false; } };
  function el(name, attrs, parent) { const e = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; }
  function gridSVG() {
    const svg = el('svg', { viewBox: '-0.2 -0.2 15.4 15.4' });
    for (let i = 0; i <= 15; i++) {
      const a = { stroke: i % 4 === 0 || i === 15 ? 'rgba(27,25,23,.28)' : 'rgba(27,25,23,.1)', 'stroke-width': 0.04 };
      el('line', { x1: i, y1: 0, x2: i, y2: 15, ...a }, svg); el('line', { x1: 0, y1: i, x2: 15, y2: i, ...a }, svg);
    }
    return svg;
  }
  async function pictureSVG(payload) {
    const svg = gridSVG();
    try {
      const p = await M.readPayload(payload);
      const regions = M.regionsOf(p);
      const px = M.pixels(regions, new Set(regions.map(r => r.id)));
      if (px) {
        const c = document.createElement('canvas'); c.width = M.W; c.height = M.H;
        c.getContext('2d').putImageData(new ImageData(px, M.W, M.H), 0, 0);
        el('image', { href: c.toDataURL(), x: 0, y: 0, width: 15, height: 15, preserveAspectRatio: 'none' }, svg);
      }
      for (const seg of p.segments) {
        if (seg.length === 1) { el('circle', { cx: seg[0].x, cy: seg[0].y, r: 0.22, fill: '#1b1917' }, svg); continue; }
        el('polyline', { points: seg.map(q => q.x + ',' + q.y).join(' '), fill: 'none', stroke: '#1b1917', 'stroke-width': 0.22, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
      }
    } catch (e) {}
    return svg;
  }
  let current = null;
  function open(item) {
    current = item;
    $('play').hidden = false;
    $('playCaps').textContent = item.theme === 'messages' ? t('msgCaps') : t('number', toSolve.indexOf(item) + 1);
    load(item);
    for (const e of document.querySelectorAll('.tile')) e.classList.toggle('on', e.dataset.id === item.id);
    $('play').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  async function tile(item, number) {
    const b = document.createElement('button');
    b.className = 'tile'; b.dataset.id = item.id; b.type = 'button';
    const face = document.createElement('div'); face.className = 'face';
    if (item.theme === 'messages') face.appendChild(await pictureSVG(localized(item)));
    else { face.appendChild(gridSVG()); const q = document.createElement('div'); q.className = 'q'; q.textContent = '?'; face.appendChild(q); }
    if (solved(localized(item))) { const d = document.createElement('span'); d.className = 'done'; d.textContent = t('solved'); face.appendChild(d); }
    const title = document.createElement('div'); title.className = 't';
    const detail = document.createElement('div'); detail.className = 'd';
    const p = await M.readPayload(localized(item)).catch(() => null);
    if (item.theme === 'messages') title.textContent = (p && p.message) || '';
    else { title.textContent = t('number', number); const points = p ? p.segments.reduce((n, s) => n + s.length, 0) : 0; detail.textContent = p ? t(M.length(points)) : ''; }
    b.append(face, title, detail);
    b.onclick = () => open(item);
    if (current && current.id === item.id) b.classList.add('on');
    return b;
  }
  // MARK: The Library, newest number first, PER to a page; ?p=2 opens page 2.
  const PER = 6, newest = toSolve.slice().reverse(), pages = Math.max(1, Math.ceil(newest.length / PER));
  let page = Math.min(pages, Math.max(1, +(new URLSearchParams(location.search).get('p') || 1)));
  async function render() {
    const grid = $('solve'); grid.textContent = '';
    for (const item of newest.slice((page - 1) * PER, page * PER)) grid.appendChild(await tile(item, toSolve.indexOf(item) + 1));
    $('pager').innerHTML = Array.from({ length: pages }, (_, i) => `<button type="button" data-p="${i + 1}"${i + 1 === page ? ' aria-current="page"' : ''}>${i + 1}</button>`).join('');
    const msg = $('messages'); msg.textContent = '';
    for (const item of all.filter(i => i.theme === 'messages')) msg.appendChild(await tile(item, 0));
  }
  $('pager').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    page = +b.dataset.p; history.replaceState(null, '', page > 1 ? '?p=' + page : location.pathname); render();
    $('libTop').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  window.onSolved = render;
  render();

})();
</script>
</body>
</html>
