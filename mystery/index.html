<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A mystery picture — Coordigo</title>
<!-- The picture travels in the fragment (#…), which never reaches a server: the preview card is fixed, and the page
     reads the picture on the device. No tracking, no cookies. -->
<meta name="description" content="Someone drew you a picture as a code. Connect the dots to see what it is.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161c" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Coordigo">
<meta property="og:url" content="https://coordigo.com/mystery">
<meta property="og:title" content="Someone drew you a mystery picture">
<meta property="og:description" content="Connect the dots to see what it is.">
<meta property="og:image" content="https://coordigo.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-itunes-app-after-6.2" content="app-id=1486330879">
<script>
  // The banner's "Open" carries the picture into the app (the fragment never reaches a server).
  const banner = document.querySelector('meta[name="apple-itunes-app-after-6.2"]');
  if (banner) banner.content = 'app-id=1486330879, app-argument=' + location.href;
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f4ec; --mat:#fffdf8; --ink:#1b1917; --muted:#6d6557;
    --line:rgba(27,25,23,.14); --hair:rgba(27,25,23,.09);
    --gold:#a8761a; --grid:rgba(27,25,23,.055); --mark:#d02670; --heart:#e3404d; --wrong:#c7333f;
    /* A pair is column then row: the first digit goes across (blue, the top axis), the second down (orange, the left). */
    --x:#1f6bd1; --y:#d0631a;
    --shadow:0 1px 2px rgba(27,25,23,.07), 0 10px 26px rgba(27,25,23,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15161c; --mat:#1d1f27; --ink:#eae5da; --muted:#9b9486;
      --line:rgba(234,229,218,.16); --hair:rgba(234,229,218,.10);
      --gold:#dcac48; --grid:rgba(234,229,218,.05); --mark:#ef5fa0; --x:#6aa6ff; --y:#ff9a52;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:23px 23px; min-height:100vh;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  main{max-width:560px;margin:0 auto;padding:0 16px 40px}
  nav{display:flex;align-items:center;gap:10px;padding:18px 0 10px}
  nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
  .mark{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#fff;
    background:var(--mark);font-weight:600;font-size:12px}
  nav .name{font-weight:600;font-size:17px}
  nav .hearts{margin-left:auto;font-size:20px;letter-spacing:2px;color:var(--heart)}
  nav .hearts .gone{color:var(--line)}
  .caps{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  h1{font-weight:600;font-size:28px;line-height:1.2;margin:6px 0 2px}
  .from{font-style:italic;font-size:18px;color:var(--muted)}
  .card{background:var(--mat);border:1px solid var(--hair);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .center{text-align:center}
  .rules{text-align:left;margin:18px 0;font-size:15px}
  .rules p{margin:4px 0}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font:600 16px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    border-radius:14px;padding:15px;margin-top:10px;cursor:pointer;border:1px solid var(--ink)}
  .ink{background:var(--ink);color:var(--paper)}
  .line{background:transparent;color:var(--ink)}
  .quiet{border:none;background:none;color:var(--muted);font-weight:500;font-size:14px;padding:10px}
  .env-grid{width:170px;margin:26px auto 16px;position:relative}
  .env-grid span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;color:#1b1917bf}
  /* The board is paper in both themes: the colors were chosen on white. */
  .board{background:#fffdf8;border-radius:12px;box-shadow:var(--shadow);padding:6px;touch-action:none;user-select:none;-webkit-user-select:none}
  .board svg{display:block;width:100%;height:auto;cursor:crosshair}
  .notice{min-height:26px;margin:12px 2px 6px;font-size:17px}
  .notice.wrong{color:var(--wrong);font-family:inherit;font-size:15px}
  /* Lines break between pairs only — never inside one — and a gap marks lifting the pen. */
  .code{position:relative;font-size:18px;line-height:1.75;max-height:132px;overflow:auto;word-break:normal;overflow-wrap:normal;word-spacing:1.1em}
  .code .done{opacity:.28}
  .code .now{background:rgba(168,118,26,.35);font-weight:700;border-radius:3px}
  .px{color:var(--x)} .py{color:var(--y)}
  .code > wbr + span{margin-left:.22em}   /* one line's pairs sit close; lines stand apart (word-spacing), founder 10/23 */
  .code .done .px,.code .done .py{color:inherit}
  /* A phone: the board takes the screen's width, as Photos does with a picture. */
  @media (max-width:600px){ main{padding:0 12px 40px} .board{margin:0 -12px;border-radius:0;padding:2px} }
  .embed main{padding:0 0 8px} .embed #panel,.embed #reveal,.embed #notice{margin-left:12px;margin-right:12px}
  .embed .board{margin:0;border-radius:0;padding:2px}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .reveal h2{font-weight:600;font-size:26px;margin:0}
  .reveal .msg{font-style:italic;font-size:19px;margin:10px 0 4px}
  .badge{font:600 12px -apple-system,sans-serif;color:var(--gold)}
  .burn{color:#c74d26;font-size:15px;margin:8px 0}
  .small{font-size:13px;color:var(--muted);margin-top:14px}
  [hidden]{display:none!important}
  /* Inside the landing (coordigo.com/): the page around it has the nav and the store links. */
  .embed nav > a,.embed [data-store],.embed [data-apple],.embed #openApp1,.embed #openApp2{display:none!important}
  .embed nav{padding:0 12px 4px;min-height:0}   /* only the hearts: the landing has the brand */
  /* The first point, shown once: where to begin on a page that opens straight on the board. */
  @keyframes beckon{0%{r:.3;opacity:.9}70%{r:.75;opacity:0}100%{r:.75;opacity:0}}
  .beckon{animation:beckon 1.4s ease-out infinite}
  .embed{background:transparent;min-height:0;display:flow-root}   /* its height is the landing's to set */
  .embed main{padding-bottom:8px}
</style>
</head>
<body>
<main>
  <nav>
    <a href="/" aria-label="Coordigo"><span class="mark">Co</span><span class="name">Coordigo</span></a>
    <span class="hearts" id="hearts" hidden aria-live="polite"></span>
  </nav>

  <!-- No picture, or one that can't be read -->
  <section id="intro" hidden>
    <div class="card center">
      <h1 data-t="title"></h1>
      <p id="introText"></p>
      <a class="btn ink" data-t="get" data-store="web-mystery"></a>
      <a class="btn line" href="/" data-t="libCaps"></a>
    </div>
  </section>

  <!-- No picture: how a code names a point, in three taps, then the birthday cake (the app's first launch too) -->
  <section id="lesson" hidden>
    <div class="caps" data-t="lessonCaps"></div>
    <h1 id="lessonPrompt" style="margin:6px 0 4px"></h1>
    <p id="lessonHint" style="color:var(--muted);margin:0 0 6px"></p>
    <div class="notice wrong" id="lessonMiss" aria-live="polite"></div>
    <div class="board"><svg id="lessonSvg" viewBox="-0.7 -0.6 8.4 3.5" aria-label="Points"></svg></div>
    <button class="btn ink" id="lessonNext" data-t="lessonNext" style="margin-top:16px" hidden></button>
    <button class="btn quiet" id="lessonSkip" data-t="skip"></button>
  </section>

  <!-- The envelope -->
  <section id="envelope" hidden class="center">
    <div class="env-grid"><svg id="envGrid" viewBox="-0.2 -0.2 15.4 15.4"></svg><span>?</span></div>
    <h1 data-t="title"></h1>
    <div class="from" id="envFrom"></div>
    <div class="caps" id="envLength" style="margin-top:6px"></div>
    <div class="card rules">
      <p>♥ <span id="heartsLine"></span></p>
      <p id="hexLine"># <span data-t="hex"></span></p>
    </div>
    <button class="btn ink" id="start" data-t="start"></button>
    <a class="btn line" id="openApp1" data-t="open" hidden></a>
    <a class="btn quiet" data-t="get" data-store="web-mystery-envelope"></a>
  </section>

  <!-- Solving -->
  <section id="play" hidden>
    <div class="board" id="board"><svg id="svg" viewBox="-1.15 -1.15 16.6 16.6" aria-label="Mystery picture grid"></svg></div>
    <div id="panel" class="card" style="margin-top:12px">
      <div class="notice mono" id="notice" aria-live="polite"></div>
      <div class="code mono" id="code"></div>
      <div class="hint" id="hint" data-t="typeHint"></div>
      <div class="hint" id="heartsHint" hidden></div>
    </div>
    <div id="reveal" class="card reveal" style="margin-top:12px" hidden>
      <div style="display:flex;align-items:baseline;gap:10px;justify-content:space-between">
        <h2 id="revealTitle"></h2><span class="badge" id="perfect" data-t="perfect" hidden></span>
      </div>
      <div class="burn" id="burnLine" data-t="burned" hidden></div>
      <div class="msg" id="revealMsg" hidden></div>
      <div class="from" id="revealFrom" style="font-size:14px"></div>
      <a class="btn ink" data-store="web-mystery-reply" data-apple><span data-t="sendBack"></span></a>
      <p class="small" data-t="sendBackSub" data-apple></p>
      <!-- Where the App Store can't help (Android, Windows): a reply to the sender is still one tap away. -->
      <button class="btn ink" id="tellThem" data-t="tellThem" hidden></button>
      <a class="btn line" id="openApp2" data-t="open" hidden></a>
    </div>
  </section>
</main>
<script src="/store.js"></script>
<script src="strings.js"></script>
<script src="engine.js"></script>
<script src="cake.js"></script>
<script>
(() => {
  'use strict';
  const M = window.Mystery, $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const STORE = 'https://apps.apple.com/app/id1486330879';

  // MARK: Words — the reader's language, else English.
  const table = window.MYSTERY_STRINGS;
  const lang = (() => {
    // Inside a landing language page, that page's language (`?lang=ko`).
    const asked = new URLSearchParams(location.search).get('lang');
    if (asked && table[asked]) return asked;
    for (const raw of navigator.languages || [navigator.language || 'en']) {
      const l = raw.toLowerCase();
      if (l.startsWith('zh')) return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
      if (l.startsWith('pt')) return 'pt-BR';
      const p = l.split('-')[0];
      if (table[p]) return p;
    }
    return 'en';
  })();
  document.documentElement.lang = lang;
  if (lang === 'ar') document.documentElement.dir = 'rtl';
  const t = (key, ...args) => {
    let s = (table[lang] && table[lang][key]) || table.en[key] || key, i = 0;
    return s.replace(/%(?:(\d)\$)?(@|lld|d)/g, (_, n) => String(args[n ? +n - 1 : i++]));
  };
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll('[data-store]')) el.href = STORE + '?ct=' + el.dataset.store;

  // MARK: The picture in the link

  // Inside the landing (`?embed`): the landing has the nav and the store links; this page reports its height and
  // what was solved.
  const embed = new URLSearchParams(location.search).has('embed');
  if (embed) {
    document.body.classList.add('embed');
    let sent = 0;
    const tell = () => {
      const h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h !== sent) { sent = h; parent.postMessage({ co: 'height', h }, '*'); }
    };
    // Observed, and checked twice a second (a font or a section that appears after the payload is read).
    new ResizeObserver(tell).observe(document.body);
    setInterval(tell, 500);
  }

  const payload = location.hash.slice(1);
  window.addEventListener('hashchange', () => location.reload());
  // The app opens the same link (coordigo://…); shown where the app can run.
  const appleDevice = /iPhone|iPad|Macintosh/.test(navigator.userAgent);
  // Coordigo runs on iPhone, iPad and Mac only: elsewhere the store links would lead nowhere.
  // Before Coordigo 6.2 is in the App Store (store.js), no link leads to the app: the store has a different one.
  const storeReady = window.CO_STORE === true;
  if (!appleDevice || !storeReady) for (const el of document.querySelectorAll('[data-store], [data-apple]')) el.hidden = true;
  for (const id of ['openApp1', 'openApp2']) { $(id).href = 'coordigo://mystery#' + payload; $(id).hidden = !appleDevice || !payload || !storeReady; }

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const keyOf = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return 'coordigo.mystery.' + h.toString(16); };

  function showIntro(textKey) {
    $('introText').textContent = t(textKey);
    $('intro').hidden = false;
  }

  if (!payload) { lesson(); return; }

  // MARK: The lesson — tap 30 (across), then 12 and 52 (down): a triangle.

  function lesson() {
    const targets = [[3, 0], [1, 2], [5, 2]], code = ([x, y]) => M.DIGITS[x] + M.DIGITS[y];
    const tapped = [], svg = $('lessonSvg');
    $('lesson').hidden = false;
    $('lessonSkip').onclick = () => { $('lesson').hidden = true; showIntro('intro'); };
    $('lessonNext').onclick = () => { location.hash = (window.MYSTERY_CAKE || {})[lang] || window.MYSTERY_CAKE.en; };
    function draw() {
      const step = tapped.length, done = step === targets.length, rows = step === 0 ? 1 : 3;
      svg.textContent = '';
      if (tapped.length) {
        const pts = tapped.map(([x, y]) => x + ',' + y).join(' ');
        el(done ? 'polygon' : 'polyline', { points: pts, fill: done ? 'rgb(255,214,10)' : 'none', stroke: '#1f1c1f',
          'stroke-width': 0.08, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
      }
      for (let y = 0; y < rows; y++) for (let x = 0; x < 8; x++) {
        const hit = tapped.some(p => p[0] === x && p[1] === y);
        const g = el('g', { role: 'button', 'aria-label': code([x, y]), style: 'cursor:pointer' }, svg);
        el('circle', { cx: x, cy: y, r: 0.45, fill: 'transparent' }, g);
        el('circle', { cx: x, cy: y, r: hit ? 0.13 : 0.09, fill: hit ? '#1f1c1f' : 'rgba(31,28,31,.4)' }, g);
        const label = el('text', { x, y: y + 0.42, 'text-anchor': 'middle', 'font-size': 0.26, 'font-weight': 600,
          'font-family': 'ui-monospace,SFMono-Regular,Menlo,monospace' }, g);
        el('tspan', { fill: '#1f6bd1' }, label).textContent = M.DIGITS[x];        // across: the first digit
        el('tspan', { fill: '#d0631a' }, label).textContent = M.DIGITS[y];        // down: the second
        if (!done && !hit) g.addEventListener('click', () => tap([x, y]));
      }
      const prompt = $('lessonPrompt');
      if (done) prompt.textContent = t('lessonDone');
      else {
        // The pair to tap in the axes' colours (its digits are found in the text, wherever the language puts them).
        const want = targets[step], text = t('lessonTap', code(want)), at = text.lastIndexOf(code(want));
        prompt.replaceChildren(text.slice(0, at));
        const a = document.createElement('span'); a.style.color = 'var(--x)'; a.textContent = M.DIGITS[want[0]];
        const b = document.createElement('span'); b.style.color = 'var(--y)'; b.textContent = M.DIGITS[want[1]];
        prompt.append(a, b, text.slice(at + 2));
      }
      $('lessonHint').textContent = t(done ? 'lessonDoneSub' : ['lessonHint1', 'lessonHint2', 'lessonHint3'][step]);
      $('lessonNext').hidden = !done;
      $('lessonSkip').hidden = done;
    }
    function tap(p) {
      const want = targets[tapped.length];
      if (p[0] === want[0] && p[1] === want[1]) { tapped.push(p); $('lessonMiss').textContent = ''; }
      else $('lessonMiss').textContent = t('lessonMiss', code(p), code(want));
      draw();
    }
    draw();
  }

  M.readPayload(payload).then(start, e => showIntro(e && e.kind === 'newer' ? 'newer' : 'broken'));

  function start(picture) {
    const saveKey = keyOf(payload);
    let layers;                                   // the board's SVG layers, made when play starts
    let lit = null;                               // the column and row lit on the axes (a press, or the first point)
    const solve = new M.Solve(picture);
    const saved = store.get(saveKey);
    if (saved) solve.resume(saved);

    // MARK: Envelope

    const envGrid = $('envGrid');
    gridInto(envGrid, false);
    $('envFrom').textContent = picture.from ? t('from', picture.from) : '';
    $('envLength').textContent = t(M.length(solve.pointCount));
    $('heartsLine').textContent = t(solve.burnsColors ? 'heartsColors' : 'heartsMessage');
    $('hexLine').hidden = !!store.get('coordigo.mystery.hexExplained');
    $('start').onclick = () => { store.set('coordigo.mystery.hexExplained', true); $('envelope').hidden = true; play(); };
    // On the landing the board is open at once (founder 2026-10-23: no envelope, no Start — the first tap starts it);
    // a link someone sent opens on its envelope, which names who it is from.
    if (embed || (saved && (saved.segment || saved.point || saved.wrongTotal))) { store.set('coordigo.mystery.hexExplained', true); play(); }
    else $('envelope').hidden = false;

    // MARK: Board

    function play() {
      $('play').hidden = false;
      $('hearts').hidden = false;
      const svg = $('svg');
      gridInto(svg, true);
      layers = {
        fill: el('image', { x: 0, y: 0, width: 15, height: 15, preserveAspectRatio: 'none', style: 'image-rendering:pixelated' }, svg),
        lines: el('g', { stroke: '#1b1917', 'stroke-width': 0.16, 'stroke-linecap': 'round', fill: 'none' }, svg),
        dots: el('g', { fill: '#1b1917' }, svg),
        pen: el('circle', { r: 0.28, fill: 'none', stroke: '#a8761a', 'stroke-width': 0.12, visibility: 'hidden' }, svg),
        guides: el('g', { 'stroke-width': 0.06, 'stroke-dasharray': '0.2 0.16', visibility: 'hidden' }, svg),
        beckon: el('circle', { r: 0.5, fill: 'none', stroke: '#a8761a', 'stroke-width': 0.1, class: 'beckon', visibility: 'hidden' }, svg),
        ring: el('circle', { r: 0.42, fill: 'rgba(168,118,26,.12)', stroke: 'rgba(168,118,26,.7)', 'stroke-width': 0.06, visibility: 'hidden' }, svg),
        wrong: el('g', { stroke: '#c7333f', 'stroke-width': 0.14, 'stroke-linecap': 'round', visibility: 'hidden' }, svg),
      };
      el('line', { stroke: X_COLOR }, layers.guides); el('line', { stroke: Y_COLOR }, layers.guides);
      el('line', { x1: -0.3, y1: -0.3, x2: 0.3, y2: 0.3 }, layers.wrong);
      el('line', { x1: -0.3, y1: 0.3, x2: 0.3, y2: -0.3 }, layers.wrong);
      // Lines and dots already found (a picture picked up again).
      redrawAll();
      input(svg);
      if (embed) { const h = $('heartsHint'); h.textContent = '♥ ' + t(solve.burnsColors ? 'heartsColors' : 'heartsMessage'); h.hidden = false; }
      render();
    }

    function redrawAll() {
      layers.lines.replaceChildren(); layers.dots.replaceChildren();
      const segs = picture.segments;
      for (let i = 0; i <= Math.min(solve.segment, segs.length - 1); i++) {
        const s = segs[i], upto = i < solve.segment ? s.length : solve.point;
        if (s.length === 1 && upto === 1) dot(s[0]);
        for (let j = 1; j < upto; j++) line(s[j - 1], s[j]);
      }
      paintFills();
    }
    const line = (a, b) => el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y }, layers.lines);
    const dot = p => el('circle', { cx: p.x, cy: p.y, r: 0.2 }, layers.dots);

    function paintFills() {
      const hide = solve.burned && solve.burnsColors;
      const px = hide ? null : M.pixels(solve.regions, solve.colored);
      if (!px) { layers.fill.removeAttribute('href'); return; }
      const c = document.createElement('canvas');
      c.width = M.W; c.height = M.H;
      c.getContext('2d').putImageData(new ImageData(px, M.W, M.H), 0, 0);
      layers.fill.setAttribute('href', c.toDataURL());
    }

    // MARK: Taps — press, slide to adjust, release to commit (as in the app); or type a pair.

    function input(svg) {
      const at = e => {
        const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        const x = Math.round(p.x), y = Math.round(p.y);
        return x >= 0 && x <= 15 && y >= 0 && y <= 15 && Math.hypot(p.x - x, p.y - y) < 0.75 ? { x, y } : null;
      };
      let pressed = false;
      svg.addEventListener('pointerdown', e => { pressed = true; svg.setPointerCapture(e.pointerId); ring(at(e)); e.preventDefault(); });
      svg.addEventListener('pointermove', e => { if (pressed || e.pointerType === 'mouse') ring(at(e)); });
      svg.addEventListener('pointerup', e => { if (!pressed) return; pressed = false; const l = at(e); ring(e.pointerType === 'mouse' ? l : null); if (l) commit(l); });
      svg.addEventListener('pointercancel', () => { pressed = false; ring(null); });
      svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') ring(null); });
      let typed = '';
      document.addEventListener('keydown', e => {
        if (e.metaKey || e.ctrlKey || e.altKey || solve.isFinished) return;
        const ch = e.key.length === 1 ? e.key.toUpperCase() : '';
        if (M.DIGITS.includes(ch)) {
          typed += ch;
          if (typed.length === 2) { const l = { x: M.DIGITS.indexOf(typed[0]), y: M.DIGITS.indexOf(typed[1]) }; typed = ''; commit(l); }
          else { notice(typed + '_', false); }
        } else if (e.key === 'Escape' || e.key === 'Backspace') { typed = ''; render(); }
      });
    }

    // Where the finger is: the ring, its column lit on top and its row on the left, and a guide to each — a finger
    // covers the point it aims at, the axes say which it is before it lifts.
    function ring(l, beckoned) {
      if (lit) {
        axisX[lit.x].setAttribute('fill-opacity', 0.72); axisX[lit.x].removeAttribute('font-size'); axisX[lit.x].setAttribute('font-weight', lit.x % 4 === 0 ? 700 : 500);
        axisY[lit.y].setAttribute('fill-opacity', 0.72); axisY[lit.y].removeAttribute('font-size'); axisY[lit.y].setAttribute('font-weight', lit.y % 4 === 0 ? 700 : 500);
        lit = null;
      }
      if (!l || solve.isFinished) { layers.ring.setAttribute('visibility', 'hidden'); layers.guides.setAttribute('visibility', 'hidden'); return; }
      layers.ring.setAttribute('cx', l.x); layers.ring.setAttribute('cy', l.y); layers.ring.setAttribute('visibility', 'visible');
      for (const a of [axisX[l.x], axisY[l.y]]) { a.setAttribute('fill-opacity', 1); a.setAttribute('font-size', 0.8); a.setAttribute('font-weight', 800); }
      lit = { x: l.x, y: l.y, beckoned: !!beckoned };
      if (beckoned) layers.ring.setAttribute('visibility', 'hidden');
      const [gx, gy] = layers.guides.children;
      gx.setAttribute('x1', l.x); gx.setAttribute('x2', l.x); gx.setAttribute('y1', -0.2); gx.setAttribute('y2', l.y);
      gy.setAttribute('y1', l.y); gy.setAttribute('y2', l.y); gy.setAttribute('x1', -0.2); gy.setAttribute('x2', l.x);
      layers.guides.setAttribute('visibility', 'visible');
    }

    let wrongTimer;
    function commit(l) {
      if (solve.isFinished) return;
      const step = solve.tap(l);
      if (step.outcome === 'ignored') return;
      if (step.outcome === 'wrong') {
        layers.wrong.setAttribute('transform', `translate(${l.x} ${l.y})`);
        layers.wrong.setAttribute('visibility', 'visible');
        notice(t('wrong', M.pair(step.tapped), M.pair(step.wanted)), true, step.wanted);
        if (navigator.vibrate) navigator.vibrate(40);
        clearTimeout(wrongTimer);
        wrongTimer = setTimeout(() => { layers.wrong.setAttribute('visibility', 'hidden'); render(); }, 1600);
        save(); renderHearts(); renderCode();
        if (solve.burned && solve.burnsColors) paintFills();
        return;
      }
      clearTimeout(wrongTimer);
      layers.wrong.setAttribute('visibility', 'hidden');
      if (step.outcome === 'line') line(step.from, l);
      if (step.outcome === 'dot') dot(l);
      if (step.newlyColored.length) paintFills();
      save();
      render();
    }

    const save = () => store.set(saveKey, solve.saved);

    // MARK: What the panel says

    function notice(text, wrong, pair) {
      const n = $('notice');
      n.className = 'notice ' + (wrong ? 'wrong' : 'mono');
      n.replaceChildren();
      // The pair it names wears the axes' colours.
      const at = pair ? text.lastIndexOf(M.pair(pair)) : -1;
      if (at < 0) { n.textContent = text; return; }
      n.append(text.slice(0, at)); pairSpans(pair, n); n.append(text.slice(at + 2));
    }

    function render() {
      renderHearts();
      const target = solve.target;
      // The pen sits on the last point of the line being drawn.
      if (!solve.isFinished && solve.point > 0) {
        const p = picture.segments[solve.segment][solve.point - 1];
        layers.pen.setAttribute('cx', p.x); layers.pen.setAttribute('cy', p.y); layers.pen.setAttribute('visibility', 'visible');
      } else layers.pen.setAttribute('visibility', 'hidden');
      if (target) notice(solve.burned ? t('burnedNext', M.pair(target)) : t(solve.point === 0 ? 'startAt' : 'next', M.pair(target)), false, target);
      // Nothing placed yet on a board that opened by itself: the first point beckons, its column and row lit.
      const first = embed && target && solve.segment === 0 && solve.point === 0 && !solve.wrongTotal;
      layers.beckon.setAttribute('visibility', first ? 'visible' : 'hidden');
      if (first) { layers.beckon.setAttribute('cx', target.x); layers.beckon.setAttribute('cy', target.y); if (!lit) ring(target, true); }
      else if (lit && lit.beckoned) ring(null);
      renderCode();
      if (solve.isFinished) reveal();
    }

    function renderHearts() {
      const h = $('hearts');
      h.replaceChildren();
      for (let k = 0; k < M.HEARTS; k++) { const s = document.createElement('span'); s.textContent = k < solve.heartsLeft ? '♥' : '♡'; if (k >= solve.heartsLeft) s.className = 'gone'; h.appendChild(s); }
      h.setAttribute('aria-label', t('left', solve.heartsLeft));
    }

    function renderCode() {
      const box = $('code');
      box.replaceChildren();
      let now;
      picture.segments.forEach((seg, i) => {
        if (i > 0) box.appendChild(document.createTextNode(' '));
        seg.forEach((p, j) => {
          if (j > 0) box.appendChild(document.createElement('wbr'));
          const s = pairSpans(p, document.createElement('span'));
          if (i < solve.segment || (i === solve.segment && j < solve.point)) s.className = 'done';
          else if (i === solve.segment && j === solve.point) { s.className = 'now'; now = s; }
          box.appendChild(s);
        });
      });
      // Keep the point wanted now in view inside the code box only (scrollIntoView would also move the page around it).
      if (now) {
        const top = now.offsetTop, bottom = top + now.offsetHeight;      // the box is the span's offset parent
        if (top < box.scrollTop) box.scrollTop = top;
        else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight;
      }
    }

    function reveal() {
      $('panel').hidden = true;
      layers.pen.setAttribute('visibility', 'hidden');
      layers.ring.setAttribute('visibility', 'hidden');
      const wordsBurned = solve.burned && !solve.burnsColors;
      $('revealTitle').textContent = picture.title && !wordsBurned ? t('its', picture.title) : t('solved');
      $('perfect').hidden = !solve.perfect;
      $('burnLine').hidden = !wordsBurned;
      const m = $('revealMsg');
      m.hidden = wordsBurned || !picture.message;
      m.textContent = picture.message ? '“' + picture.message + '”' : '';
      $('revealFrom').textContent = picture.from ? t('from', picture.from) : '';
      if (!appleDevice) {
        const tell = $('tellThem');
        tell.hidden = false;
        tell.onclick = async () => {
          const text = t('solvedShare') + (picture.title && !wordsBurned ? ' ' + t('its', picture.title) : '');
          try {
            if (navigator.share) await navigator.share({ text });
            else { await navigator.clipboard.writeText(text); tell.textContent = t('copied'); }
          } catch (e) {}
        };
      }
      store.set(saveKey + '.solved', true);
      if (embed) parent.postMessage({ co: 'solved', key: saveKey }, '*');
      $('reveal').hidden = false;
      $('reveal').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // MARK: Drawing helpers

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }

  // The 16 × 16 grid: a line every square, a bolder one every four (0, 4, 8, C), 0–F along the top and left.
  function gridInto(svg, axes) {
    el('rect', { x: 0, y: 0, width: 15, height: 15, fill: '#fffdf8' }, svg);
    const g = el('g', { 'stroke-linecap': 'square' }, svg);
    for (let i = 0; i <= 15; i++) {
      const bold = i % 4 === 0 || i === 15;
      const a = { stroke: bold ? 'rgba(27,25,23,.30)' : 'rgba(27,25,23,.12)', 'stroke-width': bold ? 0.05 : 0.03 };
      el('line', { x1: i, y1: 0, x2: i, y2: 15, ...a }, g);
      el('line', { x1: 0, y1: i, x2: 15, y2: i, ...a }, g);
    }
    if (!axes) return;
    // Across on top in blue, down the left in orange: the colours the code's two digits wear.
    const lab = el('g', { 'font-family': 'ui-monospace,SFMono-Regular,Menlo,monospace', 'font-size': 0.62, 'text-anchor': 'middle' }, svg);
    axisX = []; axisY = [];
    for (let i = 0; i <= 15; i++) {
      const w = i % 4 === 0 ? 700 : 500;
      const tx = el('text', { x: i, y: -0.55, 'font-weight': w, fill: X_COLOR, 'fill-opacity': 0.72 }, lab); tx.textContent = M.DIGITS[i];
      const ty = el('text', { x: -0.68, y: i + 0.21, 'font-weight': w, fill: Y_COLOR, 'fill-opacity': 0.72 }, lab); ty.textContent = M.DIGITS[i];
      axisX.push(tx); axisY.push(ty);
    }
  }
  // The board is paper in both themes: the axis colours are the light ones.
  const X_COLOR = '#1f6bd1', Y_COLOR = '#d0631a';
  let axisX = [], axisY = [];
  /// A pair in two colours: column (across) then row (down).
  function pairSpans(p, parent) {
    const a = document.createElement('span'); a.className = 'px'; a.textContent = M.DIGITS[p.x];
    const b = document.createElement('span'); b.className = 'py'; b.textContent = M.DIGITS[p.y];
    parent.append(a, b);
    return parent;
  }
})();
</script>
</body>
</html>
