<!doctype html>
<meta charset="utf-8">
<title>Stitch hoops</title>
<!-- tools/stitch-hoops.py opens this headless: ?ids=a,b → each pattern's stitched hoop (library/stitch-draw.js, the engine's
     drawing) as a JPEG on white, for the /cross-stitch/ pages and image search. -->
<script src="/library/stitch-draw.js"></script>
<pre id="out"></pre>
<script>
  (async () => {
    const q = new URLSearchParams(location.search), D = window.CoStitchDraw, res = {};
    for (const id of (q.get('ids') || '').split(',').filter(Boolean)) {
      const d = await fetch('/library/stitch/' + id + '.json').then(r => r.json());
      const cv = document.createElement('canvas'); cv._w = 600; cv._dpr = 1; D.draw(cv, d);
      const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
      const g = out.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(cv, 0, 0);
      res[id] = out.toDataURL('image/jpeg', 0.86);
    }
    document.getElementById('out').textContent = 'RESULT ' + JSON.stringify(res) + ' END';
  })();
</script>
